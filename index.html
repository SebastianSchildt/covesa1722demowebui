<script>
    $(document).ready(function () {
        initAll();
        addSteeringCurrent();
        //addrightKnob();
    });


    function addSteeringCurrent() {
        // Create knob element, 300 x 300 px in size.
        window.steeringcurrent = pureknob.createKnob(250, 250);

        // Set properties.
        steeringcurrent.setProperty('angleStart', -0.75 * Math.PI);
        steeringcurrent.setProperty('angleEnd', 0.75 * Math.PI);
        steeringcurrent.setProperty('colorFG', '#ff0000');
        steeringcurrent.setProperty('trackWidth', 0.4);
        steeringcurrent.setProperty('valMin', -1000);
        steeringcurrent.setProperty('valMax', 1000);
        steeringcurrent.setProperty('readOnly', true);

        // Set initial value.
        steeringcurrent.setValue(50);

        /*
         * Event listener.
         *
         * Parameter 'knob' is the knob object which was
         * actuated. Allows you to associate data with
         * it to discern which of your knobs was actuated.
         *
         * Parameter 'value' is the value which was set
         * by the user.
         */
        const listener = function (steeringcurrent, value) {
            console.log(value);
        };

        steeringcurrent.addListener(listener);

        // Create element node.
        const node = steeringcurrent.node();

        // Add it to the DOM.
        const elem = document.getElementById('steering_current');
        elem.appendChild(node);
    }

    function addrightKnob() {
        // Create knob element, 300 x 300 px in size.
        window.rknob = pureknob.createKnob(150, 150);

        // Set properties.
        rknob.setProperty('angleStart', -0.75 * Math.PI);
        rknob.setProperty('angleEnd', 0.75 * Math.PI);
        rknob.setProperty('colorFG', '#0000ff');
        rknob.setProperty('trackWidth', 0.4);
        rknob.setProperty('valMin', 0);
        rknob.setProperty('valMax', 5 * 360);
        rknob.setProperty('readOnly', true);


        // Set initial value.
        rknob.setValue(50);

        /*
         * Event listener.
         *
         * Parameter 'knob' is the knob object which was
         * actuated. Allows you to associate data with
         * it to discern which of your knobs was actuated.
         *
         * Parameter 'value' is the value which was set
         * by the user.
         */
        const listener = function (rknob, value) {
            console.log(value);
        };

        rknob.addListener(listener);

        // Create element node.
        const node = rknob.node();

        // Add it to the DOM.
        const elem = document.getElementById('rightknob');
        elem.appendChild(node);
    }

    function handleSliderChange() {
        var slider = document.getElementById('slider');
        publishTargetAngle(slider.value);
    }

</script>
